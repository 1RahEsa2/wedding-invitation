<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wedding Invitation</title><style>html{scroll-behavior:smooth}body{margin:0;font-family:Georgia,serif;background:#f5e6d8;overflow-x:hidden}section{padding:60px 20px;background:#f5e6d8}#cover{width:100%;height:100vh;background-image:url("closed_env.png");background-size:cover;background-position:center;cursor:pointer;transition:1s}#content{display:none}.hero{min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column}.hero-image{width:80%;max-width:700px;animation:float 3s infinite ease-in-out}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(10px)}100%{transform:translateY(0)}}names-section{min-height:auto;display:flex;justify-content:center;align-items:center;opacity:0;transform:translateY(80px);transition:1.2s}.names-section.show{opacity:1;transform:translateY(0)}.invitation-image{width:85%;max-width:900px;border-radius:30px;box-shadow:0 10px 40px rgba(0,0,0,0.15)}.clock-section{min-height:auto;display:flex;justify-content:center;align-items:center}.clock{font-size:80px;font-weight:bold;color:#8b6b61;letter-spacing:5px;text-align:center}.date-section{min-height:auto;display:flex;justify-content:center;align-items:center;flex-direction:column}.date-image{width:85%;max-width:900px;display:block;border-radius:30px;box-shadow:0 10px 40px rgba(0,0,0,0.2);opacity:0;transform:translateY(80px);transition:1.2s}.date-image.show{opacity:1;transform:translateY(0)}.map-section{min-height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column}.map-title{font-size:60px;color:#8b5e3c;margin-bottom:50px;text-align:center}.map-container{width:90%;max-width:1000px;height:500px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,0.2)}.map-container iframe{width:100%;height:100%;border:none}@media(max-width:768px){section{padding:40px 15px}.hero{min-height:80vh}.hero-image{width:90%}.invitation-image,.date-image{width:95%}.clock{font-size:45px;letter-spacing:3px}.map-container{height:300px}.map-title{font-size:32px}.final-message{font-size:22px;padding-bottom:60px}}.final-message{text-align:center;font-size:38px;color:#8b5e3c;font-family:"Tahoma",sans-serif;padding-bottom:120px}</style></head><body><div id="cover"></div><div id="content"><section class="hero"><img src="open_env.png" class="hero-image"></section><section class="names-section" id="namesSection"><img src="invitation.png" class="invitation-image"></section><section class="clock-section"><div class="clock" id="clock">00:00:00</div></section><section class="date-section"><img src="date.jpg" class="date-image" id="dateImage"></section><section class="map-section"><h1 class="map-title">Wedding Location</h1><div class="map-container"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3363.112356474853!2d35.86427812488797!3d32.54984649556178!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151c768518faa80d%3A0x76368ba33b0a2924!2z2LXYp9mE2Kkg2KfZhNi02LHZgiDZhNmE2KfYrdiq2YHYp9mE2KfYqg!5e0!3m2!1sar!2sjo!4v1778512398156!5m2!1sar!2sjo" loading="lazy"></iframe></div></section><section><div class="final-message">يمنع اصطحاب الاطفال<br>يمنع التصوير منعا باتا</div></section></div><script>document.getElementById("cover").onclick=function(){this.style.opacity="0";setTimeout(()=>{this.style.display="none";document.getElementById("content").style.display="block"},1000)};const namesSection=document.getElementById("namesSection"),dateImage=document.getElementById("dateImage"),clock=document.getElementById("clock"),clockSection=document.querySelector(".clock-section");window.addEventListener("scroll",()=>{let t=namesSection.getBoundingClientRect().top;t<window.innerHeight-100&&namesSection.classList.add("show");let i=dateImage.getBoundingClientRect().top;i<window.innerHeight-100&&dateImage.classList.add("show");let c=clockSection.getBoundingClientRect().top;c<window.innerHeight-100&&startClockAnimation()});const target={hours:"07",minutes:"30",seconds:"00"};let clockStarted=false;function randomNumber(e){return String(Math.floor(Math.random()*e)).padStart(2,"0")}function startClockAnimation(){if(clockStarted)return;clockStarted=true;let h="00",m="00",s="00";let i=setInterval(()=>{h=randomNumber(99);m=randomNumber(59);s=randomNumber(59);clock.innerHTML=`${h}:${m}:${s}`},50);setTimeout(()=>{clearInterval(i);let r,n=setInterval(()=>{r=randomNumber(59);n=randomNumber(59);clock.innerHTML=`${target.hours}:${r}:${n}`},50);setTimeout(()=>{clearInterval(n);let t=setInterval(()=>{n=randomNumber(59);clock.innerHTML=`${target.hours}:${target.minutes}:${n}`},50);setTimeout(()=>{clearInterval(t);clock.innerHTML=`${target.hours}:${target.minutes}:${target.seconds}`},2e3)},2e3)},2e3)}</script></body></html>
